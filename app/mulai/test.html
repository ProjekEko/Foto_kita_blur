<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Foto Kita Blur</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #f7f3f0;
        min-height: 100vh;
        padding: 24px;
      }

      .wrapper {
        max-width: 1100px;
        margin: auto;
      }

      /* ================= HEADER ================= */

      .header {
        width: 100%;
        background: #fff;
        border-radius: 20px;
        padding: 18px 28px;
        margin-bottom: 18px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.03);

        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .sebelah-kiri-ujung {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .sebelah-kanan-ujung {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .sebelah-kiri,
      .sebelah-kanan {
        padding: 9px 20px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }

      .sebelah-kiri {
        background: #f1ece8;
        color: #333;
      }

      .sebelah-kanan {
        background: #222;
        color: #fff;
      }

      .logo-icon {
        width: 40px;
        height: 40px;
        background: #d9d0c8;
        border-radius: 10px;
        flex-shrink: 0;
      }

      .brand-name {
        font-size: 20px;
        font-weight: 600;
        color: #222;
        white-space: nowrap;
      }

      /* ================= MAIN ================= */

      .container-custom {
        background: transparent;
      }

      .preview-wrapper {
        position: relative;
        margin-bottom: 22px;
      }

      .preview-main {
        width: 100%;
        height: 540px;
        background: #ddd6cf;
        border-radius: 24px;

        /* CENTER CONTENT */
        display: flex;
        align-items: center;
        justify-content: center;

        text-align: center;
      }

      .camera-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .camera-icon {
        font-size: 70px;
        line-height: 1;
        margin-bottom: 20px;
        opacity: 0.8;
      }

      .camera-text {
        font-size: 18px;
        font-weight: 300;
        letter-spacing: 0.3px;
        color: #555;
      }

      /* ================= FLOATING CONTROLS ================= */

      .floating-controls {
        position: absolute;
        top: 18px;
        right: 18px;
        display: flex;
        gap: 8px;
      }

      .ctrl-dot {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.5);

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 13px;
      }

      /* ================= BOTTOM ================= */

      .prompt-input {
        background: #fff;
        border-radius: 24px;
        padding: 22px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.03);

        display: flex;
        justify-content: center;
        gap: 18px;
      }

      .thumb-card {
        width: 95px;
        height: 95px;
        border-radius: 18px;
        background: #ddd6cf;
        border: 2px dashed #d0c9c3;
        flex-shrink: 0;
      }

      /* ================= FOOTER ================= */

      .footer-text {
        text-align: center;
        margin-top: 22px;
        color: #8d857e;
        font-size: 14px;
        font-weight: 500;
      }

      .footer-text strong {
        color: #4b4b4b;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <!-- HEADER -->
      <div class="header">
        <!-- KIRI -->
        <div class="sebelah-kiri-ujung">
          <div class="logo-icon"></div>
          <div class="brand-name">Foto Kita Blur</div>
        </div>

        <!-- KANAN -->
        <div class="sebelah-kanan-ujung">
          <div class="sebelah-kiri">Joget</div>
          <div class="sebelah-kanan">Bergaya</div>
        </div>
      </div>

      <div class="container-custom">
        <!-- VIDEO -->
        <div class="preview-wrapper">
          <div class="preview-main">
            <div class="camera-content">
              <div class="camera-icon">📷</div>

              <p class="camera-text">
                Tekan "Mulai Rekam" untuk menampilkan kamera
              </p>
              <button>mulai rekam</button>
            </div>
          </div>

          <!-- FLOATING CONTROLS -->
          <div class="floating-controls">
            <div class="ctrl-dot">1</div>
            <div class="ctrl-dot">2</div>
            <div class="ctrl-dot">3</div>
          </div>
        </div>

        <!-- HASIL FOTO -->
        <div class="prompt-input">
          <div class="thumb-card"></div>

          <div class="thumb-card"></div>

          <div class="thumb-card"></div>
        </div>

        <!-- FOOTER -->
        <footer class="footer-text">Buatan <strong>Eko Haryadi</strong></footer>
      </div>
    </div>
  </body>
</html>
